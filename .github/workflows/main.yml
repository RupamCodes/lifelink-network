name: Automated Update

on:
  schedule:
    - cron: '0 0 * * *' # Example schedule
  workflow_dispatch:

# Grant write permissions to GITHUB_TOKEN
permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ... your build/update steps that create/modify last_update.txt ...

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: automated daily update"
          branch: main
          file_pattern: "."
          commit_author: "RupamCodes <157722068+RupamCodes@users.noreply.github.com>"
